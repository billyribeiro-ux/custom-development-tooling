# pyproject.toml — the single, standardized home for Python project metadata
# and tool configuration (PEP 518/621). We dissect this file in Module 10.

[project]
name = "custom-development-tooling"
version = "1.0.0"
description = "Python tooling artifacts for the Custom Development Tooling course."
readme = "README.md"
requires-python = ">=3.11"
# The Python generator uses only the standard library, so there are zero
# runtime dependencies. That is a deliberate teaching choice: tooling that
# depends on nothing is tooling that always runs.
dependencies = []

[dependency-groups]
# Dev-only tools (PEP 735 dependency groups). Installed with `pip install --group dev`.
dev = ["ruff>=0.6"]

# Ruff is an extremely fast linter + formatter that replaces flake8, isort,
# black, and more. Configuring it here keeps all Python tooling in one file.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A sensible, strict-ish starter rule set. Each code is a family of checks:
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
