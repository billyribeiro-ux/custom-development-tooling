<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <link rel="stylesheet" href="{{assets}}/styles.css" />
</head>
<body class="home">
  <header class="hero">
    <p class="hero-edition">{{edition}}</p>
    <h1>{{courseTitle}}</h1>
    <p class="hero-subtitle">{{subtitle}}</p>
    <p class="hero-actions">
      <a class="btn-primary" href="{{firstHref}}">Start the course &rarr;</a>
      <span class="hero-count">{{total}} lessons</span>
    </p>
  </header>

  <main class="toc">
{{toc}}
  </main>

  <footer class="site-footer">
    <p class="footer-meta">Built by its own tooling — see Module 5, “Dissecting this site’s generate-pages.mjs”.</p>
  </footer>
</body>
</html>
