<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="canonical" href="{{canonical}}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{courseTitle}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{canonical}}" />
  <title>{{title}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d1117'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%237ee787' font-family='monospace' font-weight='bold'%3E%26gt;_%3C/text%3E%3C/svg%3E" />
  <script>try{var t=localStorage.getItem('cdt-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="{{assets}}/styles.css" />
  <script defer src="{{assets}}/app.js"></script>
</head>
<body class="home" data-total="{{total}}" data-nav="{{navData}}">
  <header class="site-header">
    <a class="brand" href="#">{{courseTitle}}</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme (t)">🌙</button>
  </header>

  <header class="hero">
    <p class="hero-edition">{{edition}}</p>
    <h1>{{courseTitle}}</h1>
    <p class="hero-subtitle">{{subtitle}}</p>
    <p class="hero-actions">
      <a class="btn-primary" href="{{firstHref}}">Start the course &rarr;</a>
      <a class="btn-secondary" id="resume-btn" href="#" hidden>Resume &rarr;</a>
      <span class="hero-count">{{total}} lessons</span>
    </p>
    <p class="hero-progress" id="hero-progress"></p>
  </header>

  <main class="toc">
{{toc}}
  </main>

  <footer class="site-footer">
    <p class="footer-meta">Built by its own tooling — see Module 5, “Dissecting this site’s generate-pages.mjs”.</p>
  </footer>
</body>
</html>
